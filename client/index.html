<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clues of the Mind</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0d0f14; }
      body {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #e8e6e1;
      }
      canvas { display: block; }

      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        font-size: 12px;
        line-height: 1.7;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        opacity: 0.85;
      }
      #hud b { color: #d8b46a; font-weight: 600; }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(8, 10, 14, 0.92);
        backdrop-filter: blur(3px);
        transition: opacity 0.25s;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      .card { text-align: center; max-width: 380px; padding: 0 20px; }
      .card h1 { font-size: 22px; letter-spacing: 0.06em; margin-bottom: 6px; }
      .card .sub { font-size: 12px; opacity: 0.55; margin-bottom: 26px; }
      .card p { font-size: 12px; opacity: 0.7; line-height: 1.9; margin-top: 22px; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 11px 26px;
        border: 1px solid #d8b46a;
        border-radius: 3px;
        background: transparent;
        color: #d8b46a;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: background 0.15s, color 0.15s;
      }
      button:hover { background: #d8b46a; color: #0d0f14; }
      button:disabled { opacity: 0.4; cursor: default; border-color: #666; color: #666; background: transparent; }
      kbd {
        border: 1px solid #444; border-radius: 3px; padding: 1px 5px;
        font-size: 11px; background: #191c22;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>

    <div id="overlay">
      <div class="card">
        <h1>🔎 CLUES OF THE MIND 🕶</h1>
        <div class="sub">milestone 2 &middot; the house</div>
        <button id="play" disabled>connecting&hellip;</button>
        <p>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move &middot; mouse to look<br />
          <kbd>esc</kbd> to release the cursor
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
