<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clues of the Mind</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0d0f14; }
      body {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #e8e6e1;
      }
      canvas { display: block; }

      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        font-size: 12px;
        line-height: 1.7;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        opacity: 0.85;
      }
      #hud b { color: #d8b46a; font-weight: 600; }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(8, 10, 14, 0.92);
        backdrop-filter: blur(3px);
        transition: opacity 0.25s;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      .card { text-align: center; max-width: 380px; padding: 0 20px; }
      .card h1 { font-size: 22px; letter-spacing: 0.06em; margin-bottom: 6px; }
      .card .sub { font-size: 12px; opacity: 0.55; margin-bottom: 26px; }
      .card p { font-size: 12px; opacity: 0.7; line-height: 1.9; margin-top: 22px; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 11px 26px;
        border: 1px solid #d8b46a;
        border-radius: 3px;
        background: transparent;
        color: #d8b46a;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: background 0.15s, color 0.15s;
      }
      button:hover { background: #d8b46a; color: #0d0f14; }
      button:disabled { opacity: 0.4; cursor: default; border-color: #666; color: #666; background: transparent; }
      kbd {
        border: 1px solid #444; border-radius: 3px; padding: 1px 5px;
        font-size: 11px; background: #191c22;
      }

      /* ---- the tablet (milestone 4) */
      #tablet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 20;
        transition: opacity 0.14s;
      }
      #tablet.hidden { display: none; }
      /* Opaque backdrop hides the world for the roster panels; the camera
         panel leaves it transparent so the live feed shows through. */
      #tablet.opaque { background: rgba(6, 8, 12, 0.92); }

      #tablet .frame {
        width: min(78vw, 940px);
        height: min(74vh, 620px);
        border: 2px solid #3a3f4b;
        border-radius: 14px;
        background: rgba(13, 16, 22, 0.28);
        box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.35), 0 22px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #tablet.opaque .frame { background: #0f1218; }

      #tablet .tabs {
        display: flex; align-items: center; justify-content: center; gap: 4px;
        padding: 12px; font-size: 12px; letter-spacing: 0.12em;
        border-bottom: 1px solid #262b35;
        background: rgba(10, 12, 17, 0.72);
      }
      #tablet .tabs span { color: #5b6172; padding: 3px 12px; border-radius: 3px; }
      #tablet .tabs span.active { color: #0d0f14; background: #d8b46a; font-weight: 600; }
      #tablet .tabs em { color: #333; font-style: normal; }

      #tablet .screen { flex: 1; position: relative; overflow-y: auto; }

      #tablet .feedtag {
        position: absolute; top: 12px; left: 14px;
        font-size: 11px; letter-spacing: 0.1em; color: #ff4d4d;
        text-shadow: 0 1px 3px #000;
      }
      #tablet .empty {
        position: absolute; inset: 0; display: grid; place-content: center;
        text-align: center; color: #8b90a0; font-size: 14px; line-height: 2;
      }
      #tablet .empty span { font-size: 12px; opacity: 0.7; }

      #tablet .note {
        padding: 12px 18px; font-size: 11.5px; color: #8b90a0;
        border-bottom: 1px solid #20242d; background: rgba(0,0,0,0.2);
      }
      #tablet .roster { list-style: none; }
      #tablet .roster li {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 18px; border-bottom: 1px solid #191d25;
      }
      #tablet .roster .face {
        width: 30px; height: 30px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.14); flex: 0 0 auto;
      }
      #tablet .roster .who { flex: 1; font-size: 13px; }
      #tablet .roster .who em { color: #d8b46a; font-style: normal; font-size: 11px; }
      #tablet .roster .detail { display: block; font-size: 11px; color: #6c7180; margin-top: 1px; }
      #tablet .roster button { padding: 5px 14px; font-size: 12px; }

      #tablet .foot {
        padding: 10px; text-align: center; font-size: 11px; color: #6c7180;
        border-top: 1px solid #262b35; background: rgba(10, 12, 17, 0.72);
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>

    <div id="overlay">
      <div class="card">
        <h1>🔎 CLUES OF THE MIND 🕶</h1>
        <div class="sub">milestone 4 &middot; the tablet</div>
        <button id="play" disabled>connecting&hellip;</button>
        <p>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; mouse look &middot; <kbd>E</kbd> join in<br />
          <kbd>F</kbd> drop a camera &middot; <kbd>Q</kbd> raise the tablet<br />
          <span style="opacity:.6">you are one of the guests</span>
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
