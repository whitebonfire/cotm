<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clues of the Mind</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0d0f14; }
      body {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color: #e8e6e1;
      }
      canvas { display: block; }

      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        font-size: 12px;
        line-height: 1.7;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
        opacity: 0.85;
      }
      #hud b { color: #d8b46a; font-weight: 600; }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(8, 10, 14, 0.92);
        backdrop-filter: blur(3px);
        transition: opacity 0.25s;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      .card { text-align: center; max-width: 380px; padding: 0 20px; }
      .card h1 { font-size: 22px; letter-spacing: 0.06em; margin-bottom: 6px; }
      .card .sub { font-size: 12px; opacity: 0.55; margin-bottom: 26px; }
      .card p { font-size: 12px; opacity: 0.7; line-height: 1.9; margin-top: 22px; }
      button {
        font: inherit;
        font-size: 13px;
        padding: 11px 26px;
        border: 1px solid #d8b46a;
        border-radius: 3px;
        background: transparent;
        color: #d8b46a;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: background 0.15s, color 0.15s;
      }
      button:hover { background: #d8b46a; color: #0d0f14; }
      button:disabled { opacity: 0.4; cursor: default; border-color: #666; color: #666; background: transparent; }
      kbd {
        border: 1px solid #444; border-radius: 3px; padding: 1px 5px;
        font-size: 11px; background: #191c22;
      }

      /* ---- the tablet (milestone 4) */
      #tablet {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 20;
        transition: opacity 0.14s;
      }
      #tablet.hidden { display: none; }
      /* Opaque backdrop hides the world for the roster panels; the camera
         panel leaves it transparent so the live feed shows through. */
      #tablet.opaque { background: rgba(6, 8, 12, 0.92); }

      #tablet .frame {
        width: min(78vw, 940px);
        height: min(74vh, 620px);
        border: 2px solid #3a3f4b;
        border-radius: 14px;
        background: rgba(13, 16, 22, 0.28);
        box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.35), 0 22px 60px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #tablet.opaque .frame { background: #0f1218; }

      #tablet .tabs {
        display: flex; align-items: center; justify-content: center; gap: 4px;
        padding: 12px; font-size: 12px; letter-spacing: 0.12em;
        border-bottom: 1px solid #262b35;
        background: rgba(10, 12, 17, 0.72);
      }
      #tablet .tabs span { color: #5b6172; padding: 3px 12px; border-radius: 3px; }
      #tablet .tabs span.active { color: #0d0f14; background: #d8b46a; font-weight: 600; }
      #tablet .tabs em { color: #333; font-style: normal; }

      #tablet .screen { flex: 1; position: relative; overflow-y: auto; }

      #tablet .feedtag {
        position: absolute; top: 12px; left: 14px;
        font-size: 11px; letter-spacing: 0.1em; color: #ff4d4d;
        text-shadow: 0 1px 3px #000;
      }
      #tablet .empty {
        position: absolute; inset: 0; display: grid; place-content: center;
        text-align: center; color: #8b90a0; font-size: 14px; line-height: 2;
      }
      #tablet .empty span { font-size: 12px; opacity: 0.7; }

      #tablet .note {
        padding: 12px 18px; font-size: 11.5px; color: #8b90a0;
        border-bottom: 1px solid #20242d; background: rgba(0,0,0,0.2);
      }
      #tablet .roster { list-style: none; }
      #tablet .roster li {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 18px; border-bottom: 1px solid #191d25;
      }
      #tablet .roster .face {
        width: 30px; height: 30px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.14); flex: 0 0 auto;
      }
      #tablet .roster .who { flex: 1; font-size: 13px; }
      #tablet .roster .who em { color: #d8b46a; font-style: normal; font-size: 11px; }
      #tablet .roster .detail { display: block; font-size: 11px; color: #6c7180; margin-top: 1px; }
      #tablet .roster button { padding: 5px 14px; font-size: 12px; }

      #tablet .foot {
        padding: 10px; text-align: center; font-size: 11px; color: #6c7180;
        border-top: 1px solid #262b35; background: rgba(10, 12, 17, 0.72);
      }
      #tablet .roster button[data-interview] { border-color: #d8b46a; color: #d8b46a; }
      #tablet .denied {
        margin: 10px 18px 0; padding: 8px 12px; font-size: 12px;
        color: #e0a05a; border: 1px solid #6b4a2a; border-radius: 3px; background: rgba(90,50,20,0.2);
      }

      /* interview: the waiting (blank) panel */
      #tablet .waiting {
        position: absolute; inset: 0; display: grid; place-content: center;
        text-align: center; gap: 10px; color: #cdd0d8; font-size: 15px;
      }
      #tablet .waiting .qmark {
        font-size: 60px; color: #d8b46a; justify-self: center;
        width: 96px; height: 96px; line-height: 96px; border-radius: 50%;
        border: 2px dashed #4a4030; margin-bottom: 8px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      #tablet .waiting .sub { font-size: 12px; color: #7c818f; }
      @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

      /* interview: the reveal thread */
      #tablet .thread { padding: 22px; display: flex; flex-direction: column; align-items: center; }
      #tablet .portrait {
        border-radius: 8px; border: 1px solid #2b2f3a; image-rendering: pixelated;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      #tablet .who-name { margin: 12px 0 16px; font-size: 16px; color: #e8e6e1; letter-spacing: 0.04em; }
      #tablet .bubble {
        max-width: 560px; align-self: flex-start; margin-left: 8%;
        padding: 14px 18px; border-radius: 4px 16px 16px 16px;
        background: #1b2029; border: 1px solid #2b3140;
        font-size: 15px; line-height: 1.6; color: #dfe2e8; white-space: pre-wrap;
      }
      #tablet .thread [data-back] {
        margin-top: 22px; font-size: 12px; padding: 8px 18px; align-self: center;
      }

      /* the typing box (being questioned) */
      #typebox {
        position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
        background: rgba(6, 8, 12, 0.9); backdrop-filter: blur(3px);
      }
      #typebox.hidden { display: none; }
      .tb-frame {
        width: min(88vw, 640px); background: #0f1218;
        border: 1px solid #3a3f4b; border-radius: 12px; overflow: hidden;
        box-shadow: 0 24px 70px rgba(0,0,0,0.7);
      }
      .tb-head {
        padding: 12px 16px; font-size: 12px; letter-spacing: 0.06em; color: #cdd0d8;
        border-bottom: 1px solid #262b35; background: rgba(10,12,17,0.7);
        display: flex; align-items: center; gap: 8px;
      }
      .tb-head .tb-dot { color: #ff4d4d; animation: pulse 1.4s infinite; }
      .tb-timer { margin-left: auto; font-size: 14px; color: #9aa0ae; }
      .tb-timer.urgent { color: #ff5d5d; font-weight: 700; }
      .tb-q { padding: 16px 18px 6px; font-size: 16px; color: #e8e6e1; }
      .tb-persona {
        margin: 0 18px 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6;
        color: #b9bdc8; background: #171b22; border-left: 2px solid #d8b46a; border-radius: 3px;
      }
      .tb-persona .tb-label { font-size: 10px; letter-spacing: 0.14em; color: #7c818f; margin-bottom: 4px; }
      .tb-persona .tb-hint { margin-top: 8px; font-size: 11px; color: #6c7180; font-style: italic; }
      .tb-input {
        display: block; width: calc(100% - 36px); margin: 0 18px; resize: none;
        font: inherit; font-size: 15px; line-height: 1.6; color: #e8e6e1;
        background: #0a0c11; border: 1px solid #2b3140; border-radius: 4px; padding: 12px;
      }
      .tb-input:focus { outline: none; border-color: #d8b46a; }
      .tb-foot { display: flex; align-items: center; padding: 12px 18px 16px; gap: 12px; }
      .tb-count { font-size: 12px; color: #6c7180; }
      .tb-count.full { color: #ff5d5d; }
      .tb-send { margin-left: auto; }
    </style>
  </head>
  <body>
    <div id="hud"></div>

    <div id="overlay">
      <div class="card">
        <h1>🔎 CLUES OF THE MIND 🕶</h1>
        <div class="sub">milestone 5 &middot; the interview</div>
        <button id="play" disabled>connecting&hellip;</button>
        <p>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; mouse look &middot; <kbd>E</kbd> join in<br />
          <kbd>F</kbd> drop a camera &middot; <kbd>Q</kbd> tablet, then question a guest<br />
          <span style="opacity:.6">you are one of the guests</span>
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
